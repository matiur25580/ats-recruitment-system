# LEARNING NOTE: GitHub Actions CI workflow. Each job installs dependencies and runs checks so broken changes are caught before merging.
name: CI

on:
  push:
    branches:
      - main
      - upgrade/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/hireflow_integration_test
      JWT_SECRET: integration-test-secret-at-least-32-characters
      CLOUDINARY_CLOUD_NAME: test-cloud
      CLOUDINARY_API_KEY: 123456789
      CLOUDINARY_API_SECRET: test-cloudinary-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Test backend
        working-directory: server
        run: npm test

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Build frontend
        working-directory: client
        run: npm run build
